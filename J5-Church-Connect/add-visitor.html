<!DOCTYPE html>
<html>

<head>

<title>
Add Visitor
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
👋 Add New Visitor
</h1>

<p>
J5 Church Connect
</p>

</header>



<div class="form-box">


<input type="text" placeholder="Full Name">


<input type="tel" placeholder="Phone Number">


<input type="tel" placeholder="WhatsApp Number">


<input type="email" placeholder="Email Address">


<input type="text" placeholder="Home Address">



<select>

<option>
Service Attended
</option>

<option>
Sunday Worship
</option>

<option>
Bible Study
</option>

<option>
Special Event
</option>

</select>



<input type="date">



<input type="text" placeholder="Invited By">



<select>

<option>
Follow-Up Status
</option>

<option>
New Visitor
</option>

<option>
Contacted
</option>

<option>
Visited
</option>

<option>
Converted To Member
</option>

</select>



<textarea placeholder="Notes"></textarea>



<button>
Save Visitor
</button>



</div>


</body>

</html>
