<!DOCTYPE html>
<html>

<head>

<title>
Add Sermon
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
🎙️ Add New Sermon
</h1>

<p>
J5 Church Connect Media
</p>

</header>




<div class="form-box">



<input type="text" placeholder="Sermon Title">



<input type="text" placeholder="Preacher Name">



<input type="date">



<input type="text" placeholder="Bible Passage">



<select>

<option>
Sermon Category
</option>

<option>
Sunday Sermon
</option>

<option>
Bible Study
</option>

<option>
Conference
</option>

<option>
Teaching Series
</option>

<option>
Testimony
</option>

</select>



<input type="url" placeholder="YouTube / Video Link">



<input type="url" placeholder="Audio Link">



<textarea placeholder="Sermon Description"></textarea>



<button>
Save Sermon
</button>



</div>



</body>

</html>
