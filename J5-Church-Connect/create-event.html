<!DOCTYPE html>
<html>

<head>

<title>
Create Event
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
📅 Create New Event
</h1>

<p>
J5 Church Connect
</p>

</header>




<div class="form-box">



<input type="text" placeholder="Event Name">



<select>

<option>
Event Type
</option>

<option>
Sunday Service
</option>

<option>
Conference
</option>

<option>
Bible Study
</option>

<option>
Youth Event
</option>

<option>
Outreach
</option>

<option>
Wedding
</option>

</select>



<input type="date">



<input type="time">



<input type="text" placeholder="Location">



<input type="text" placeholder="Ministry Responsible">



<input type="text" placeholder="Event Leader">



<textarea placeholder="Event Description"></textarea>



<button>
Save Event
</button>



</div>



</body>

</html>
